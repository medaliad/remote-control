<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VE Admin - Provision PC</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center;
    background: linear-gradient(180deg, #0d1b3a 0%, #050a1a 100%);
    color: #e6edf7;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    width: 100%; max-width: 440px;
    padding: 28px 28px 24px;
    background: #11203f;
    border: 1px solid #20335c;
    border-radius: 14px;
    box-shadow: 0 8px 24px rgba(0,0,0,.35);
  }
  h1 { margin: 0 0 4px; font-size: 22px; }
  p.lead { margin: 0 0 20px; color: #9cb3d6; font-size: 14px; }
  label { display: block; margin: 14px 0 6px; font-weight: 600; }
  input {
    width: 100%; box-sizing: border-box;
    padding: 10px 12px; font-size: 16px;
    background: #0a1632; color: #ffffff;
    border: 1px solid #2a4070; border-radius: 8px;
    outline: none;
  }
  input:focus { border-color: #4a6cb8; }
  input.code {
    text-transform: uppercase; letter-spacing: .25em;
    font-family: ui-monospace, "Consolas", "Menlo", monospace;
  }
  button {
    width: 100%; margin-top: 18px;
    padding: 12px; font-size: 16px; font-weight: 600;
    background: #2a6df4; color: white;
    border: 0; border-radius: 8px; cursor: pointer;
  }
  button:hover { background: #1d57c8; }
  button:disabled { background: #2a4070; cursor: default; }
  .hint { font-size: 13px; color: #9cb3d6; margin-top: 12px; }
  .ok    { color: #6cd29c; }
  .err   { color: #ef7a8a; }
  .row   { margin-top: 10px; min-height: 22px; }
</style>
</head>
<body>
<form class="card" id="f" autocomplete="off">
  <h1>Provision a PC</h1>
  <p class="lead">
    Type the 8-character code shown on the target PC's installer window,
    along with the username that PC should register as. The installer
    picks it up automatically.
  </p>

  <label for="code">Pairing code</label>
  <input id="code" name="code" class="code" required
         maxlength="9" placeholder="ABCD-2345"
         pattern="^[A-Za-z2-9]{4}-?[A-Za-z2-9]{4}$"
         autocapitalize="characters" autocorrect="off" spellcheck="false">

  <label for="username">Username</label>
  <input id="username" name="username" required maxlength="64"
         placeholder="dali">

  <button type="submit" id="btn">Send</button>
  <div class="row" id="msg"></div>
</form>

<script>
(function () {
  const form = document.getElementById('f');
  const codeInput = document.getElementById('code');
  const userInput = document.getElementById('username');
  const btn  = document.getElementById('btn');
  const msg  = document.getElementById('msg');

  // Visual nicety: auto-insert hyphen after 4 chars and uppercase.
  codeInput.addEventListener('input', () => {
    let v = codeInput.value.toUpperCase().replace(/[^A-Z2-9]/g, '');
    if (v.length > 4) v = v.slice(0, 4) + '-' + v.slice(4, 8);
    codeInput.value = v;
  });

  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    msg.className = 'row'; msg.textContent = '';
    const code = codeInput.value.replace(/-/g, '').toUpperCase();
    const username = userInput.value.trim();
    if (code.length !== 8 || !username) return;

    btn.disabled = true;
    btn.textContent = 'Sending...';
    try {
      const r = await fetch('/api/provision/assign', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code, username }),
      });
      const data = await r.json().catch(() => ({}));
      if (r.ok && data.ok) {
        msg.className = 'row ok';
        msg.textContent = 'Sent. The installer should pick it up within a few seconds.';
        form.reset();
      } else {
        msg.className = 'row err';
        msg.textContent = data.error || 'Server rejected the code.';
      }
    } catch (e) {
      msg.className = 'row err';
      msg.textContent = 'Network error: ' + (e.message || e);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Send';
    }
  });
})();
</script>
</body>
</html>
